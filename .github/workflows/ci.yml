name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

# Cancel old runs of the same branch when a new push lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTFLAGS: -Dwarnings
  RUSTDOCFLAGS: -Dwarnings

permissions:
  contents: read

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm covers aarch64-unknown-linux-gnu, which release.yml
        # publishes. Without it that target is only ever compiled at tag time,
        # where a failure blocks the entire release — the exact failure mode
        # that kept this repo from ever shipping an artifact. Free for public
        # repos.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: test-${{ matrix.os }}
          # The repo cache sits near GitHub's 10 GB ceiling and adding the arm64
          # leg pushed it over, so PR runs were evicting each other. Only refresh
          # from main; PRs still read.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --no-fail-fast

  msrv:
    name: MSRV (1.94)
    runs-on: ubuntu-latest
    # RUSTUP_TOOLCHAIN is required for this job to test anything. The action
    # only runs `rustup default`, which rust-toolchain.toml (channel = "stable")
    # overrides — so before this was added the job compiled under stable and
    # never actually enforced the MSRV declared in Cargo.toml.
    env:
      RUSTUP_TOOLCHAIN: "1.94"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets --locked

  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings -Drustdoc::broken-intra-doc-links
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: docs
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --no-deps --all-features

  build:
    name: Build (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: build-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --workspace --release --locked

  cross-import-guardrail:
    name: Cross-import guardrail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check-cross-imports.sh

  deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-audit
      # Run cargo-audit directly rather than via rustsec/audit-check: the action
      # publishes results through the Checks API, which needs `checks: write`.
      # Dependabot PRs get a read-only GITHUB_TOKEN regardless of the permissions
      # block, so the API call is not reliably available to us. Ignores come from
      # .cargo/audit.toml, which cargo-audit reads natively.
      - run: cargo audit

  # cargo-audit and cargo-deny above read only the RustSec database. An
  # advisory with a GHSA but no RUSTSEC entry is invisible to both, by
  # construction — that is how GHSA-vxx9-2994-q338 (yamux, HIGH) stayed
  # unnoticed for 136 days of green builds. The next two jobs read the other
  # side: GitHub's own alerts, and OSV (which aggregates RustSec *and* GHSA).
  # Issue #59.
  dependabot-alerts:
    name: Dependabot alerts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `vulnerability-alerts: read`, NOT `security-events: read`. Measured:
      # with security-events the /dependabot/alerts endpoint returns 403
      # "Resource not accessible by integration"; with vulnerability-alerts it
      # returns 200. The two are easy to confuse and one of them silently
      # produces a gate that can never read anything.
      vulnerability-alerts: read
    steps:
      - uses: actions/checkout@v7
      - name: Fail on open high/critical alerts
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_ACTOR: ${{ github.actor }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        # Dependabot-authored PRs and PRs from forks run with a read-only
        # GITHUB_TOKEN whatever the permissions block says, so the API may not
        # be readable there. On those events an unreadable API is reported as a
        # warning; everywhere else it is a failure. It is never reported as a
        # pass: PR #29 is this repo's own example of a security job that said
        # "0 vulnerabilities" while the call behind it was failing.
        #
        # Those PRs are not left unchecked — the `OSV scan` job below needs no
        # token and covers the same GHSA-only blind spot, and this job runs
        # unrestricted on the push to main and on the daily schedule in
        # security-audit.yml.
        run: |
          mode=fail
          if [ "$EVENT_ACTOR" = "dependabot[bot]" ] || [ "$IS_FORK" = "true" ]; then
            mode=warn
          fi
          echo "unreadable-API mode: ${mode} (actor=${EVENT_ACTOR} fork=${IS_FORK:-false})"
          bash scripts/check-dependabot-alerts.sh --threshold high --on-unreadable "$mode"

  osv:
    name: OSV scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@osv-scanner
      # Only fails on findings that carry no RUSTSEC id; anything RustSec
      # knows about stays the business of cargo-audit / cargo-deny and their
      # existing ignore lists. See the header of the script.
      - run: bash scripts/check-osv.sh

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts
          additional_files: docker/test-devnet.sh

  coverage:
    name: Code coverage (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage (lcov)
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Coverage summary
        run: cargo llvm-cov report --summary-only
      - name: Enforce ≥80% lines on audit-critical crates
        run: |
          cargo llvm-cov --fail-under-lines 80 \
            -p karoowa-consensus \
            -p karoowa-bridge \
            -p karoowa-vm \
            -p karoowa-crypto \
            --summary-only
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info

  # Single aggregator gate. Branch protection requires only this check.
  ci-success:
    name: CI gate
    if: always()
    needs:
      - fmt
      - clippy
      - test
      - msrv
      - docs
      - build
      - cross-import-guardrail
      - deny
      - audit
      - dependabot-alerts
      - osv
      - typos
      - shellcheck
      - coverage
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - run: echo "All required jobs passed."
