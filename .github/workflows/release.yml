name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.6.0)"
        required: true
        type: string

permissions:
  contents: write            # create the GitHub Release
  id-token: write            # OIDC for Sigstore keyless + SLSA provenance
  attestations: write        # gh attestations
  packages: write            # push to ghcr.io
  # attest-build-provenance v4 delegates to actions/attest v4, which defaults
  # create-storage-record: true whenever push-to-registry is set (it is, in the
  # docker job). Without this scope the storage record is skipped with two
  # warning annotations per release — attest.ts wraps it in try/catch, so the
  # release does not fail, it just silently loses the Linked Artifacts record.
  artifact-metadata: write   # attest@v4 storage record

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # musl targets are deliberately absent. They failed on every tag from
        # v0.1.0 to v0.5.0 and, because `release` needs this job, took the whole
        # release with them — which is why this repo has never published an
        # artifact. `musl-tools` provides musl-gcc but no C++ compiler, and
        # librocksdb-sys builds RocksDB from C++ source; the aarch64 leg also
        # used a *glibc* cross-gcc as the linker for a *musl* target. See #41
        # for the reintroduction plan (non-blocking, static, clearly labelled).
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          # Native arm64 — no cross-compilation. Free for public repos.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          cache-on-failure: true

      - name: Build (maxperf profile)
        run: cargo build --profile maxperf --package karoowa --target ${{ matrix.target }} --locked

      - name: Stage artifact (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/maxperf
          chmod +x karoowa
          tar czf "${{ github.workspace }}/karoowa-${TAG}-${{ matrix.target }}.tar.gz" karoowa

      - name: Stage artifact (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/maxperf/karoowa.exe" `
            -DestinationPath "karoowa-${env:TAG}-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: karoowa-${{ matrix.target }}
          path: karoowa-${{ env.TAG }}-${{ matrix.target }}.*
          if-no-files-found: error

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: sbom
          cache-on-failure: true
      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx
      - name: Generate workspace SBOM
        run: cargo cyclonedx --format json --output-pattern bom -f -
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: |
            **/bom.json
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: artifacts

      - name: Generate SHA-256 checksums
        run: |
          cd artifacts
          sha256sum karoowa-* > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign artifacts (Sigstore keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
          COSIGN_YES: "true"
        run: |
          cd artifacts
          for f in karoowa-* checksums-sha256.txt; do
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.crt" \
              "$f"
          done

      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            artifacts/karoowa-*

      - name: Create or update GitHub Release (draft)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/karoowa-*.tar.gz
            artifacts/karoowa-*.zip
            artifacts/karoowa-*.sig
            artifacts/karoowa-*.crt
            artifacts/checksums-sha256.txt
            artifacts/checksums-sha256.txt.sig
            artifacts/checksums-sha256.txt.crt

  docker:
    name: Build & push container image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Feed the Dockerfile the MSRV from Cargo.toml rather than trusting its
      # default. The pin had silently fallen to 1.85 against a 1.94 workspace,
      # which would fail the image build outright.
      - name: Read workspace MSRV
        id: msrv
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "Workspace MSRV: $v"
          test -n "$v" || { echo "could not read rust-version from Cargo.toml"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            RUST_VERSION=${{ steps.msrv.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SLSA provenance for image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true
