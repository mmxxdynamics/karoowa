version: 2
updates:
  # Rust crate dependencies (workspace-wide).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/London
    open-pull-requests-limit: 10
    labels: ["A-dependencies", "C-cargo"]
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      cargo-minor-and-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions used by workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels: ["A-dependencies", "C-github-actions"]
    commit-message:
      prefix: "chore(ci)"
      include: scope
    groups:
      github-actions-minor-and-patch:
        update-types: ["minor", "patch"]

  # Docker base images.
  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/London
    open-pull-requests-limit: 3
    labels: ["A-dependencies", "C-docker"]
    commit-message:
      prefix: "chore(docker)"
