# cargo-audit configuration
# https://docs.rs/cargo-audit/latest/cargo_audit/config/struct.AuditConfig.html
#
# This MUST stay in sync with the `[advisories].ignore` list in deny.toml.
# Both tools surface the same RUSTSEC advisory database; cargo-audit doesn't
# read deny.toml. Every entry here is tracked debt that must be resolved
# before the v1.0 mainnet cut.

[advisories]
ignore = [
    # --- libp2p 0.56 transitive vulnerabilities ---
    "RUSTSEC-2026-0118",  # hickory-proto: NSEC3 unbounded loop (via libp2p-dns)
    "RUSTSEC-2026-0119",  # hickory-proto: O(n²) name compression (via libp2p-dns)
    "RUSTSEC-2024-0436",  # paste: unmaintained (Linux only: netlink-packet-core → if-watch → libp2p-tcp)

    # --- bincode: permanently unmaintained, no version bump can clear this ---
    # The advisory carries `patched = []` and lists no unaffected versions: it
    # applies to bincode the crate, every version including 2.0.1 and 3.0.0.
    # The team ceased development permanently and "considers version 1.3.3 a
    # complete version of bincode that is not in need of any updates"; 3.0.0 is
    # a tombstone whose lib.rs is a single `compile_error!`. So this is not a
    # v1-series issue and is not blocked on any Dependabot PR — only migrating
    # off bincode (wincode / postcard / bitcode / rkyv) can remove this ignore.
    "RUSTSEC-2025-0141",  # bincode: unmaintained (all versions; patched = [])

    # --- wasmtime 44 → 47 bump (not yet raised) ---
    # Patched only in >=46.0.2 or >=47.0.3 — no in-place fix for the 44
    # series. Low severity (3.8), needs two Engines in one process, and the
    # node builds a single Engine. Deferred to its own reviewed PR because
    # bumping the VM three majors is consensus-critical.
    "RUSTSEC-2026-0222",  # wasmtime: stores can mix up type indices between engines
]
