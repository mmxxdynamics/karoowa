[workspace]
resolver = "2"
members = [
    "core/karoowa-crypto",
    "core/karoowa-core",
    "core/karoowa-consensus",
    "core/karoowa-storage",
    "core/karoowa-network",
    "core/karoowa-api",
    "core/karoowa-sdk",
    "core/karoowa-agents",
    "core/karoowa-vm",
    "core/karoowa-trie",
    "core/karoowa-light",
    "core/karoowa-bridge",
    "core/karoowa-governance",
    "core/karoowa",
    "enterprise/karoowa-license",
    "enterprise/karoowa-audit-log",
    "enterprise/karoowa-rbac",
    "enterprise/karoowa-hsm",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Karoowa Contributors"]
repository = "https://github.com/karoowa/karoowa"
homepage = "https://karoowa.io"
description = "Karoowa — agent-native, Rust-based blockchain framework"

[workspace.dependencies]
# Internal crates
karoowa-crypto = { path = "core/karoowa-crypto", version = "0.0.1" }
karoowa-core = { path = "core/karoowa-core", version = "0.0.1" }
karoowa-consensus = { path = "core/karoowa-consensus", version = "0.0.1" }
karoowa-storage = { path = "core/karoowa-storage", version = "0.0.1" }
karoowa-network = { path = "core/karoowa-network", version = "0.0.1" }
karoowa-api = { path = "core/karoowa-api", version = "0.0.1" }
karoowa-sdk = { path = "core/karoowa-sdk", version = "0.0.1" }
karoowa-agents = { path = "core/karoowa-agents", version = "0.0.1" }
karoowa-trie = { path = "core/karoowa-trie", version = "0.0.1" }
karoowa-light = { path = "core/karoowa-light", version = "0.0.1" }
karoowa-bridge = { path = "core/karoowa-bridge", version = "0.0.1" }
karoowa-governance = { path = "core/karoowa-governance", version = "0.0.1" }

# Enterprise crates (BSL-licensed; opt-in)
karoowa-license = { path = "enterprise/karoowa-license", version = "0.0.1" }
karoowa-audit-log = { path = "enterprise/karoowa-audit-log", version = "0.0.1" }
karoowa-rbac = { path = "enterprise/karoowa-rbac", version = "0.0.1" }
karoowa-hsm = { path = "enterprise/karoowa-hsm", version = "0.0.1" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
hex = "0.4"

# Errors
anyhow = "1"
thiserror = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Testing
proptest = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
opt-level = 0
debug = true
