[workspace]
resolver = "2"
members = [
    "core/karoowa-crypto",
    "core/karoowa-core",
    "core/karoowa-consensus",
    "core/karoowa-storage",
    "core/karoowa-network",
    "core/karoowa-api",
    "core/karoowa-sdk",
    "core/karoowa-agents",
    "core/karoowa-vm",
    "core/karoowa-trie",
    "core/karoowa-light",
    "core/karoowa-bridge",
    "core/karoowa-governance",
    "core/karoowa",
    "enterprise/karoowa-license",
    "enterprise/karoowa-audit-log",
    "enterprise/karoowa-rbac",
    "enterprise/karoowa-hsm",
    "enterprise/karoowa-ha",
    "enterprise/karoowa-marketplace",
    "enterprise/karoowa-node",
]

[workspace.package]
version = "0.6.0-dev"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
authors = ["Karoowa Contributors"]
repository = "https://github.com/mmxxdynamics/karoowa"
homepage = "https://karoowa.io"
documentation = "https://docs.rs/karoowa"
description = "Karoowa — agent-native, Rust-based blockchain framework"
readme = "README.md"
keywords = ["blockchain", "consensus", "p2p", "rocksdb", "sdk"]
categories = ["cryptography::cryptocurrencies", "network-programming", "database"]

# Lints applied to every workspace member. Members opt in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_must_use = "deny"
unused_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Pragmatic exceptions: pedantic is too noisy for some idioms.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"

[workspace.dependencies]
# Internal crates
karoowa-crypto = { path = "core/karoowa-crypto", version = "0.6.0-dev" }
karoowa-core = { path = "core/karoowa-core", version = "0.6.0-dev" }
karoowa-consensus = { path = "core/karoowa-consensus", version = "0.6.0-dev" }
karoowa-storage = { path = "core/karoowa-storage", version = "0.6.0-dev" }
karoowa-network = { path = "core/karoowa-network", version = "0.6.0-dev" }
karoowa-api = { path = "core/karoowa-api", version = "0.6.0-dev" }
karoowa-sdk = { path = "core/karoowa-sdk", version = "0.6.0-dev" }
karoowa-agents = { path = "core/karoowa-agents", version = "0.6.0-dev" }
karoowa-trie = { path = "core/karoowa-trie", version = "0.6.0-dev" }
karoowa-light = { path = "core/karoowa-light", version = "0.6.0-dev" }
karoowa-bridge = { path = "core/karoowa-bridge", version = "0.6.0-dev" }
karoowa-governance = { path = "core/karoowa-governance", version = "0.6.0-dev" }

# Enterprise crates (BSL-licensed; opt-in)
karoowa-license = { path = "enterprise/karoowa-license", version = "0.6.0-dev" }
karoowa-audit-log = { path = "enterprise/karoowa-audit-log", version = "0.6.0-dev" }
karoowa-rbac = { path = "enterprise/karoowa-rbac", version = "0.6.0-dev" }
karoowa-hsm = { path = "enterprise/karoowa-hsm", version = "0.6.0-dev" }
karoowa-ha = { path = "enterprise/karoowa-ha", version = "0.6.0-dev" }
karoowa-marketplace = { path = "enterprise/karoowa-marketplace", version = "0.6.0-dev" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned: bincode 3.0.0 is a deliberate tombstone release whose entire lib.rs is
# `compile_error!("https://xkcd.com/2347/")`. 1.3.3 is the last complete release.
bincode = "1.3.3"
hex = "0.4"

# Errors
anyhow = "1"
thiserror = "2"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Testing
proptest = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Maximum-performance build for release artifacts (CI tag builds).
# Heavier link time; smaller, faster binary.
[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"

# Slightly optimised dev cycle: speeds tests in dependencies without
# blowing up incremental rebuild time.
[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 1

# Optimised build for `cargo bench` / proptest fuzz harnesses.
[profile.bench]
inherits = "release"
debug = true
