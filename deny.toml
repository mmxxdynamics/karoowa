# cargo-deny configuration for Karoowa.
# See: https://embarkstudios.github.io/cargo-deny/
#
# Runs in CI on every PR (`.github/workflows/ci.yml :: deny`).

[graph]
all-features = true

[advisories]
# RUSTSEC advisories — fail the build by default.
# `yanked = "deny"` — restored after `multihash 0.19.5` dropped its
# core2 dependency (the only yanked crate in our graph).
yanked = "deny"
#
# IMPORTANT: every entry in `ignore` below is tracked debt that MUST be
# resolved before the v1.0 mainnet cut. Two of them trace back to dep
# upgrades still pending; one cannot be cleared by any upgrade:
#
#   libp2p 0.56 → newer    (no PR yet; needs ecosystem catch-up)
#   wasmtime 44 → 47       (no PR yet; consensus-critical, needs its own review)
#   bincode                (NOT an upgrade — the advisory has `patched = []`
#                           and covers every version; only migrating off
#                           bincode entirely can clear it)
ignore = [
    # --- libp2p 0.56 transitive vulnerabilities ---
    # libp2p 0.56 is currently the latest published; hickory-proto and paste
    # advisories are blocked behind libp2p's version pins on libp2p-mdns and
    # netlink-packet-core respectively.
    "RUSTSEC-2026-0118",  # hickory-proto: NSEC3 unbounded loop (via libp2p-dns)
    "RUSTSEC-2026-0119",  # hickory-proto: O(n²) name compression (via libp2p-dns)
    "RUSTSEC-2024-0436",  # paste: unmaintained (Linux only: netlink-packet-core → if-watch → libp2p-tcp)

    # --- bincode: permanently unmaintained, no version bump can clear this ---
    # The advisory carries `patched = []` and lists no unaffected versions: it
    # applies to bincode the crate, every version including 2.0.1 and 3.0.0.
    # The team ceased development permanently and "considers version 1.3.3 a
    # complete version of bincode that is not in need of any updates"; 3.0.0 is
    # a tombstone whose lib.rs is a single `compile_error!`. So this is not a
    # v1-series issue and is not blocked on any Dependabot PR — only migrating
    # off bincode (wincode / postcard / bitcode / rkyv) can remove this ignore.
    "RUSTSEC-2025-0141",  # bincode: unmaintained (all versions; patched = [])

    # --- wasmtime 44 → 47 bump (not yet raised) ---
    # Patched only in >=46.0.2 or >=47.0.3 — no in-place fix for the 44
    # series. Low severity (3.8), needs two Engines in one process, and the
    # node builds a single Engine. Deferred to its own reviewed PR because
    # bumping the VM three majors is consensus-critical.
    "RUSTSEC-2026-0222",  # wasmtime: stores can mix up type indices between engines
]

[licenses]
# SPDX identifiers — full list at https://spdx.org/licenses/
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "OpenSSL",
    # webpki-roots 1.0+ ships under the Linux Foundation's CDLA-Permissive-2.0.
    "CDLA-Permissive-2.0",
]
# Karoowa Enterprise crates use a `LicenseRef-` SPDX expression. Allow it explicitly.
exceptions = [
    { allow = ["LicenseRef-Karoowa-Enterprise"], crate = "karoowa-license" },
    { allow = ["LicenseRef-Karoowa-Enterprise"], crate = "karoowa-audit-log" },
    { allow = ["LicenseRef-Karoowa-Enterprise"], crate = "karoowa-rbac" },
    { allow = ["LicenseRef-Karoowa-Enterprise"], crate = "karoowa-hsm" },
    { allow = ["LicenseRef-Karoowa-Enterprise"], crate = "karoowa-ha" },
    { allow = ["LicenseRef-Karoowa-Enterprise"], crate = "karoowa-marketplace" },
    { allow = ["LicenseRef-Karoowa-Enterprise"], crate = "karoowa-node-enterprise" },
]
confidence-threshold = 0.8

[bans]
# `multiple-versions = warn` because chasing every duplicate transitive dep
# in a libp2p / RocksDB / tokio graph is its own full-time job. Tighten to
# "deny" once the graph stabilises.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    # OpenSSL is forbidden — we standardise on rustls.
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
