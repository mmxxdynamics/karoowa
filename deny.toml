# cargo-deny configuration for Karoowa.
# See: https://embarkstudios.github.io/cargo-deny/
#
# Runs in CI on every PR (`.github/workflows/ci.yml :: deny`).

[graph]
all-features = true

[advisories]
# RUSTSEC advisories — fail the build by default.
# `yanked = "warn"` because the only yanked crate in our graph today is
# `core2 0.4.0` (transitively via multihash → libp2p), which is also
# ignored by RUSTSEC-2026-0105 below. Tighten back to "deny" once libp2p
# is bumped to a version that drops the multihash → core2 chain.
yanked = "warn"
#
# IMPORTANT: every entry in `ignore` below is tracked debt that MUST be
# resolved before the v1.0 mainnet cut. The current set traces back to
# three dep upgrades still pending:
#
#   libp2p 0.56 → newer    (no PR yet; needs ecosystem catch-up)
#   bincode 1 → 2/3        (Dependabot PR #11)
#   rustls-webpki bump     (no PR yet)
ignore = [
    # --- libp2p 0.56 transitive vulnerabilities ---
    "RUSTSEC-2026-0118",  # hickory-proto: NSEC3 unbounded loop (via libp2p-dns)
    "RUSTSEC-2026-0119",  # hickory-proto: O(n²) name compression (via libp2p-dns)
    "RUSTSEC-2026-0105",  # core2: unmaintained, all yanked (via multihash → libp2p-core)
    "RUSTSEC-2024-0436",  # paste: unmaintained (Linux only: netlink-packet-core → if-watch → libp2p-tcp)

    # --- bincode 1 → 2/3 bump (Dependabot PR #11) ---
    "RUSTSEC-2025-0141",  # bincode: unmaintained (v1 series)

    # --- rustls-webpki bump ---
    "RUSTSEC-2026-0098",  # rustls-webpki: name constraints for URI names accepted
    "RUSTSEC-2026-0099",  # rustls-webpki: wildcard name constraints accepted
    "RUSTSEC-2026-0104",  # rustls-webpki: panic in CRL parsing
]

[licenses]
# SPDX identifiers — full list at https://spdx.org/licenses/
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "OpenSSL",
    # webpki-roots 1.0+ ships under the Linux Foundation's CDLA-Permissive-2.0.
    "CDLA-Permissive-2.0",
]
# Karoowa Enterprise crates use a `LicenseRef-` SPDX expression. Allow it explicitly.
exceptions = [
    { allow = ["LicenseRef-Karoowa-Enterprise"], crate = "karoowa-license" },
    { allow = ["LicenseRef-Karoowa-Enterprise"], crate = "karoowa-audit-log" },
    { allow = ["LicenseRef-Karoowa-Enterprise"], crate = "karoowa-rbac" },
    { allow = ["LicenseRef-Karoowa-Enterprise"], crate = "karoowa-hsm" },
    { allow = ["LicenseRef-Karoowa-Enterprise"], crate = "karoowa-ha" },
    { allow = ["LicenseRef-Karoowa-Enterprise"], crate = "karoowa-marketplace" },
    { allow = ["LicenseRef-Karoowa-Enterprise"], crate = "karoowa-node-enterprise" },
]
confidence-threshold = 0.8

[bans]
# `multiple-versions = warn` because chasing every duplicate transitive dep
# in a libp2p / RocksDB / tokio graph is its own full-time job. Tighten to
# "deny" once the graph stabilises.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    # OpenSSL is forbidden — we standardise on rustls.
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
