# Prometheus configuration for Karoowa devnet.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "karoowa-validators"
    static_configs:
      - targets:
          - "validator-0:8545"
          - "validator-1:8545"
          - "validator-2:8545"
          - "validator-3:8545"
    metrics_path: "/metrics"
    scrape_interval: 5s
