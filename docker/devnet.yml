# Karoowa 4-validator devnet with Grafana + Prometheus.
#
# DEV ONLY — this file ships hard-coded credentials and unrestricted CORS.
# DO NOT use as a base for any production deployment. The Grafana admin
# password and the genesis-validator key files MUST be regenerated for any
# environment that handles real funds.
#
# Usage:
#   1. Generate keys:    karoowa genesis generate --validators 4 --output docker/genesis.toml
#   2. Relax key mode:   chmod 0644 docker/genesis.validator*.key
#                        (keys are written 0600; these containers run as
#                        `nonroot`/65532 and cannot read an owner-only file
#                        bind-mounted from the host. Throwaway devnet keys only.)
#   3. Copy key files:   (genesis command creates docker/genesis.validator{0..3}.key)
#   3. Start:            docker compose -f docker/devnet.yml up -d
#   4. Grafana:          http://localhost:3000 (admin/admin) — DEV ONLY
#   5. Check:            curl http://localhost:8545/health

services:
  validator-0:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command:
      - node
      - --validator-key
      - /keys/validator.key
      - --consensus
      - poa
      - --data-dir
      - /data
      - --rpc-port
      - "8545"
      - --p2p-port
      - "30303"
    ports:
      - "8545:8545"
      - "30303:30303"
    volumes:
      - v0-data:/data
      - ./genesis.validator0.key:/keys/validator.key:ro
    networks:
      - karoowa-net
    restart: unless-stopped

  validator-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command:
      - node
      - --validator-key
      - /keys/validator.key
      - --consensus
      - poa
      - --data-dir
      - /data
      - --rpc-port
      - "8545"
      - --p2p-port
      - "30303"
      - --bootnodes
      - /ip4/validator-0/tcp/30303
    volumes:
      - v1-data:/data
      - ./genesis.validator1.key:/keys/validator.key:ro
    networks:
      - karoowa-net
    restart: unless-stopped

  validator-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command:
      - node
      - --validator-key
      - /keys/validator.key
      - --consensus
      - poa
      - --data-dir
      - /data
      - --rpc-port
      - "8545"
      - --p2p-port
      - "30303"
      - --bootnodes
      - /ip4/validator-0/tcp/30303
    volumes:
      - v2-data:/data
      - ./genesis.validator2.key:/keys/validator.key:ro
    networks:
      - karoowa-net
    restart: unless-stopped

  validator-3:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command:
      - node
      - --validator-key
      - /keys/validator.key
      - --consensus
      - poa
      - --data-dir
      - /data
      - --rpc-port
      - "8545"
      - --p2p-port
      - "30303"
      - --bootnodes
      - /ip4/validator-0/tcp/30303
    volumes:
      - v3-data:/data
      - ./genesis.validator3.key:/keys/validator.key:ro
    networks:
      - karoowa-net
    restart: unless-stopped

  # -- Observability stack ---------------------------------------------------

  prometheus:
    image: prom/prometheus:v3.4.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - karoowa-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.1
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - karoowa-net
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  karoowa-net:
    driver: bridge

volumes:
  v0-data:
  v1-data:
  v2-data:
  v3-data:
  prometheus-data:
  grafana-data:
