# Karoowa single-node setup.
#
# Usage:
#   1. Generate a key:  karoowa wallet new --output docker/validator.key
#   2. Relax key mode:  chmod 0644 docker/validator.key
#                       (`wallet new` writes 0600 owned by you; this container
#                       runs as `nonroot`/65532 and cannot read an owner-only
#                       file bind-mounted from the host. Local dev key only —
#                       do not do this to a real validator key.)
#   3. Start:           docker compose -f docker/docker-compose.yml up -d
#   4. Check:           curl http://localhost:8545/health

services:
  karoowa:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command:
      - node
      - --validator-key
      - /keys/validator.key
      - --consensus
      - poa
      - --data-dir
      - /data
      - --rpc-port
      - "8545"
      - --p2p-port
      - "30303"
    ports:
      - "8545:8545"
      - "30303:30303"
    volumes:
      - karoowa-data:/data
      - ./validator.key:/keys/validator.key:ro
    restart: unless-stopped

volumes:
  karoowa-data:
